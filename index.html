<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Holodeck - Web CAD</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-color-theme="blueprint" data-brightness="dark">
    <!-- ViewCube & Projection -->
    <div id="viewcube-wrapper" class="glass-panel">
        <div id="viewcube-container"></div>
        <div style="display: flex; gap: 8px; width: 100%; justify-content: center;">
            <button id="projection-toggle" class="tool-btn icon-btn" title="Toggle Perspective / Orthographic">
                <i class="fas fa-video"></i>
            </button>
            <button id="center-selection" class="tool-btn icon-btn" title="Center Camera on Selection">
                <i class="fas fa-crosshairs"></i>
            </button>
            <button class="tool-btn active icon-btn" id="toggle-grid" title="Toggle Grid">
                <i class="fas fa-border-all"></i>
            </button>
            <button class="tool-btn icon-btn" id="unit-toggle" title="Toggle Units">
                <i class="fas fa-ruler"></i>
            </button>
        </div>
        <div style="margin-top: 8px; width: 100%;">
            <select id="snap-precision" class="tool-select" title="Snap Precision" style="width: 100%;">
                <option value="0.1">0.1 mm</option>
                <option value="1" selected>1.0 mm</option>
                <option value="5">5.0 mm</option>
                <option value="10">1.0 cm</option>
                <option value="25">2.5 cm</option>
                <option value="50">5.0 cm</option>
            </select>
        </div>
    </div>

    <!-- Theme Toggle -->
    <div id="theme-toggles">
        <select id="color-theme-select" class="tool-select glass-panel">
            <option value="blueprint">Blueprint</option>
            <option value="holodeck">Holodeck</option>
            <option value="amber">Amber CRT</option>
            <option value="matrix">Matrix</option>
        </select>
        <button id="theme-toggle-btn" class="tool-btn icon-btn glass-panel" title="Toggle Dark/Light Mode">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <!-- Top Toolbar (Global Actions) -->
    <div id="top-toolbar" class="toolbar glass-panel">
        <!-- System & File -->
        <div class="toolbar-group">
            <button class="tool-btn" id="btn-load" title="Load Project">
                <i class="fas fa-folder-open"></i>
            </button>
            <button class="tool-btn" id="btn-save" title="Save Project (.hldk)">
                <i class="fas fa-save"></i>
            </button>
            <button class="tool-btn" id="export-stl" title="Export STL">
                <i class="fas fa-file-export"></i>
            </button>
        </div>
        
        <div class="separator"></div>
        
        <!-- History -->
        <div class="toolbar-group">
            <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
                <i class="fas fa-undo"></i>
            </button>
            <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)">
                <i class="fas fa-redo"></i>
            </button>
        </div>
        
        <div class="separator"></div>
        
        <!-- Add Shapes -->
        <div class="toolbar-group">
            <button class="tool-btn" data-shape="cube" title="Add Cube">
                <i class="fas fa-cube"></i>
            </button>
            <button class="tool-btn" data-shape="sphere" title="Add Sphere">
                <i class="fas fa-circle"></i>
            </button>
            <button class="tool-btn" data-shape="cylinder" title="Add Cylinder">
                <i class="fas fa-database"></i>
            </button>
            <button class="tool-btn" data-shape="cone" title="Add Cone">
                <i class="fas fa-caret-up"></i>
            </button>
        </div>
        
        <div class="separator"></div>
        
        <!-- Transforms -->
        <div class="toolbar-group">
            <button class="tool-btn active" data-transform="translate" title="Move">
                <i class="fas fa-arrows-alt"></i>
            </button>
            <button class="tool-btn" data-transform="rotate" title="Rotate">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button class="tool-btn" data-transform="scale" title="Scale">
                <i class="fas fa-compress-arrows-alt"></i>
            </button>
        </div>

        <div class="separator"></div>

        <!-- Operations -->
        <div class="toolbar-group">
            <button class="tool-btn" id="align-mode" title="Align Selected">
                <i class="fas fa-align-center"></i>
            </button>
            <button class="tool-btn" id="distribute-shapes" title="Distribute Selected">
                <i class="fas fa-arrows-alt-h"></i>
            </button>
            <button class="tool-btn" id="group-shapes" title="Group Selected">
                <i class="fas fa-object-group"></i>
            </button>
            <button class="tool-btn" id="ungroup-shapes" title="Ungroup Selected">
                <i class="fas fa-object-ungroup"></i>
            </button>
            <button class="tool-btn" id="delete-selected" title="Delete Selected">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
        <input type="file" id="file-load" style="display: none;" accept=".hldk">
    </div>
    
    <!-- Properties Panel -->
    <div id="properties-panel" class="glass-panel">
        <h3>Properties</h3>
        <div class="prop-row" id="prop-type-row" style="margin-bottom: 12px; justify-content: center;">
            <div class="segmented-control">
                <input type="radio" id="type-solid" name="obj-type" value="solid" checked>
                <label for="type-solid">Solid</label>
                <input type="radio" id="type-hole" name="obj-type" value="hole">
                <label for="type-hole">Hole</label>
            </div>
        </div>
        <div class="prop-row" id="prop-part-row" style="display: none;">
            <select id="obj-part">
                <option value="root">Overall Shape</option>
            </select>
        </div>
        <div id="preview-container"></div>
        <div class="prop-row">
            <label>W (X):</label>
            <input type="text" id="obj-w" placeholder="Width">
        </div>
        <div class="prop-row">
            <label>H (Y):</label>
            <input type="text" id="obj-h" placeholder="Height">
        </div>
        <div class="prop-row">
            <label>L (Z):</label>
            <input type="text" id="obj-l" placeholder="Length">
        </div>
        <div class="prop-row" style="justify-content: flex-start; gap: 12px;">
            <input type="color" id="obj-color" value="#ffffff" style="cursor: pointer;">
            <label for="obj-color" style="cursor: pointer;">Color</label>
        </div>
        <div class="prop-row">
            <label for="obj-transparent">Transparent:</label>
            <input type="checkbox" id="obj-transparent" checked>
        </div>
    </div>

    <!-- Variables Panel -->
    <div id="variables-panel" class="glass-panel">
        <h3>Variables</h3>
        <div id="variables-list">
            <!-- variables will be added here -->
        </div>
        <button id="add-var-btn"><i class="fas fa-plus"></i> New Variable</button>
    </div>

    <!-- Canvas -->
    <div id="canvas-container"></div>
    
    <!-- Status Bar -->
    <div id="status-bar" class="glass-panel">
        <i class="fas fa-info-circle status-icon"></i>
        <span>Ready. Click shapes to select, drag to move. Ctrl+Click to multi-select.</span>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/interactive/SelectionBox.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/interactive/SelectionHelper.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/exporters/STLExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/postprocessing/OutlinePass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
